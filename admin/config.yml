# Configure a trusted OAuth service before using the production editor.
# Never place an OAuth client secret or personal token in this public repository.
backend:
  name: github
  repo: johndevrbx/johndevrbx.github.io
  branch: main
local_backend: true
media_folder: assets/uploads
public_folder: /assets/uploads
site_url: https://johndevrbx.github.io
logo_url: /assets/favicon.svg
collections:
  - name: portfolio
    label: Portfolio
    files:
      - name: projects
        label: Projects
        file: content/portfolio.json
        fields:
          - name: projects
            label: Projects
            widget: list
            summary: '{{fields.title}} — {{fields.category}}'
            fields:
              - {name: title, label: Title, widget: string}
              - name: category
                label: Category
                widget: select
                options:
                  - {label: Luau Systems, value: systems}
                  - {label: VFX, value: vfx}
                  - {label: Buildings & 3D, value: buildings}
                  - {label: Animations, value: animations}
              - {name: summary, label: Short description, widget: text}
              - {name: description, label: Full description, widget: text}
              - {name: cover, label: Cover image, widget: image, required: false}
              - {name: featured, label: Featured on Home, widget: boolean, default: false}
              - {name: published, label: Published, widget: boolean, default: true}
              - {name: link, label: Project link, widget: string, required: false}
              - name: media
                label: Images and videos
                widget: list
                summary: '{{fields.type}} — {{fields.caption}}'
                fields:
                  - name: type
                    label: Media type
                    widget: select
                    options: [image, video, youtube]
                  - {name: url, label: File or URL, widget: file, hint: 'Upload an image or short MP4, or paste a YouTube URL.'}
                  - {name: caption, label: Caption, widget: string, required: false}
